name: Deploy PR Preview

# Deploys a Cloudflare Pages preview of a pull request's docs build, so
# reviewers can see the rendered site before merging.
#
# This repo accepts PRs from public forks, and GitHub Actions withholds repo
# secrets (including CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID) from any
# pull_request-triggered run whose head is a fork. Switching the deploy job
# itself to pull_request_target would make secrets available, but if that job
# also checked out and built the fork's own code (npm ci && npm run build),
# it would be running arbitrary PR-controlled code with deploy credentials in
# scope -- the "pwn request" pattern GitHub explicitly warns against.
#
# workflow_run avoids this: it always runs in the base repo's context
# (secrets available regardless of fork origin) but is triggered only after
# ci.yml finishes, and never re-executes the PR's code -- it just downloads
# the dist/ artifact that ci.yml already built with no secrets present, and
# deploys that. No actions/checkout step should ever be added to this
# workflow; that would reintroduce the exposure this design avoids.
#
# Because this is workflow_run-triggered, GitHub always runs the copy of
# this file that's on the default branch (main), regardless of what's on
# the PR -- the same constraint sync-upstream-docs.yml's Claude action step
# has. Changes here only take effect once merged to main.
#
# One-time manual setup: none beyond what deploy.yml already requires
# (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: preview-deploy-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  deploy-preview:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Find associated pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // workflow_run's own `pull_requests` array is empty for PRs from
            // forks (a documented GitHub limitation) -- look the PR up by
            // head commit instead, which works for same-repo and fork PRs.
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            const pr = data.find((p) => p.state === "open");
            if (!pr) {
              core.setFailed("No open pull request found for this workflow run's head commit.");
              return;
            }
            core.setOutput("number", pr.number);

      - name: Download built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=embedme-docs --branch=pr-${{ steps.pr.outputs.number }}

      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Find-or-update a single marker comment, same idiom as
            // embedme's external-component-bot.yml.
            const marker = "<!-- generated by the preview-deploy workflow -->";
            const prNumber = ${{ steps.pr.outputs.number }};
            const body = [
              `🔍 Preview deployed: ${{ steps.deploy.outputs.pages-deployment-alias-url }}`,
              ``,
              `Commit: \`${{ github.event.workflow_run.head_sha }}\``,
              ``,
              marker,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker) && c.user.type === "Bot");
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
